<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand Glow Orbs</title>
  <link rel="stylesheet" href="style.css">
  <!-- Run with: python -m http.server 8000 (then open http://localhost:8000) -->
</head>
<body>
  <div id="ui">
    <h1>Hand Glow Orbs</h1>
    <p>Allow camera access to control glowing orbs with your index finger. If the camera is unavailable, move the mouse to guide them.</p>
    <div id="status">Requesting camera…</div>
    <label class="toggle"><input type="checkbox" id="toggle-feed"> Show camera feed</label>
  </div>
  <video id="video" playsinline></video>
  <canvas id="canvas"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>
</html>
